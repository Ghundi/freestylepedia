<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="/icons/Blackbirdlogoneuweiss-144x144.png" sizes="144x144">
    <link rel="apple-touch-icon" href="/icons/Blackbirdlogoneuweiss-144x144.png">
    <!-- Site name and logo for search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://freestylepedia.org/#website",
            "name": "Freestylepedia",
            "url": "https://freestylepedia.org/",
            "publisher": { "@id": "https://freestylepedia.org/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://freestylepedia.org/#organization",
            "name": "Blackbird Ice Freestyle",
            "url": "https://freestylepedia.org/",
            "logo": "https://freestylepedia.org/icons/Blackbirdlogoneuweiss-512x512.png",
            "sameAs": [
              "https://www.youtube.com/@BlackbirdIceFreestyle",
              "https://www.instagram.com/blackbird_ice_freestyle"
            ]
          }
        ]
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111214">
    <title>Freestylepedia</title>
    <meta name="description" content="Learn ice freestyle skating tricks and moves, and see how they connect. The site of the Freestylepedia YouTube series by Blackbird Ice Freestyle.">
    <!-- Before the app loads: no white flash in dark mode, and a stored theme choice applies at once. -->
    <style>
      html { background: #111214; color-scheme: dark; }
      @media (prefers-color-scheme: light) { html { background: #f6f6f4; color-scheme: light; } }
      html[data-theme='dark'] { background: #111214; color-scheme: dark; }
      html[data-theme='light'] { background: #f6f6f4; color-scheme: light; }
    </style>
    <script>
      try {
        var m = localStorage.getItem('themeMode');
        if (m === 'dark' || m === 'light') document.documentElement.setAttribute('data-theme', m);
      } catch (e) { /* storage unavailable: the system theme applies */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
